name: Mirror to GitLab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' \
            > ~/.ssh/known_hosts

      - name: Mirror branches and tags
        run: |
          git remote add gitlab git@gitlab.com:IvanPinezhaninov/serveza.git
          git fetch --prune --prune-tags origin \
            '+refs/heads/*:refs/mirror/heads/*' \
            '+refs/tags/*:refs/mirror/tags/*'
          git push --prune gitlab \
            '+refs/mirror/heads/*:refs/heads/*' \
            '+refs/mirror/tags/*:refs/tags/*'
